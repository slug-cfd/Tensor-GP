[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gptensor"
version = "1.0.0"
description = "Kronecker-factored Gaussian process reconstruction for high-order finite volume methods"
authors = [{name = "Dongwook Lee"}, {name = "Sean Riedel"}]
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "mpmath>=1.3"]

[project.optional-dependencies]
figures = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["gptensor"]
